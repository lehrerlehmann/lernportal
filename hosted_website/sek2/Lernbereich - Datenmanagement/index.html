<script>
const searchIndex = [{"title": "01   Definition formaler Sprachen", "url": "../../klasse10/Lernbereich - Sprachen/01 - Definition formaler Sprachen.html", "location": "Klasse 10 › Lernbereich   Sprachen"}, {"title": "02   Einstieg   DEA", "url": "../../klasse10/Lernbereich - Sprachen/02 - Einstieg - DEA-pdf.html", "location": "Klasse 10 › Lernbereich   Sprachen"}, {"title": "04   Übung zu DEAs", "url": "../../klasse10/Lernbereich - Sprachen/04 - Übung zu DEAs-pdf.html", "location": "Klasse 10 › Lernbereich   Sprachen"}, {"title": "Deterministische endliche Automaten (DEA)", "url": "../../klasse10/Lernbereich - Sprachen/03 - Lernpfad DEAs.html", "location": "Klasse 10 › Lernbereich   Sprachen"}, {"title": "Einführung in das Thema künstliche Intelligenz", "url": "../../klasse9/Lernbereich - Künstliche Intelligenz/Einführung in das Thema künstliche Intelligenz.html", "location": "Klasse 9 › Lernbereich   Künstliche Intelligenz"}];

const searchInput = document.getElementById("lp-search");
const searchButton = document.getElementById("lp-search-button");
const searchResults = document.getElementById("lp-search-results");

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function renderSearchResults() {
    const query = searchInput.value.trim().toLowerCase();

    if (!query) {
        searchResults.innerHTML = "";
        searchResults.hidden = true;
        return;
    }

    const matches = searchIndex
        .filter(item => {
            const haystack = (
                item.title + " " + item.location
            ).toLowerCase();

            return haystack.includes(query);
        })
        .slice(0, 15);

    if (matches.length === 0) {
        searchResults.innerHTML =
            '<div class="lp-search-empty">Keine Lerninhalte gefunden.</div>';
        searchResults.hidden = false;
        return;
    }

    searchResults.innerHTML = matches
        .map(item => {
            const location = item.location
                ? '<span class="lp-result-location">'
                    + escapeHtml(item.location)
                    + '</span>'
                : '';

            return (
                '<a class="lp-search-result" href="'
                + escapeHtml(item.url)
                + '">'
                + '<span class="lp-result-title">'
                + escapeHtml(item.title)
                + '</span>'
                + location
                + '<span class="lp-result-arrow">&rarr;</span>'
                + '</a>'
            );
        })
        .join("");

    searchResults.hidden = false;
}

if (searchInput && searchButton && searchResults) {
    searchInput.addEventListener("input", renderSearchResults);

    searchButton.addEventListener("click", function () {
        searchInput.focus();
        renderSearchResults();
    });

    searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            searchResults.hidden = true;
            searchInput.blur();
        }

        if (event.key === "Enter" && !searchResults.hidden) {
            const first = searchResults.querySelector(".lp-search-result");
            if (first) {
                first.click();
            }
        }
    });

    document.addEventListener("click", function (event) {
        if (!event.target.closest(".lp-global-search")) {
            searchResults.hidden = true;
        }
    });
}
</script>

</body>
</html>
