<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lernportal</title>

    <link
        rel="stylesheet"
        href="kurse.css"
    >
</head>

<body class="lp-index-page">

    <main class="lp-container">

        <nav class="lp-topbar">

            <a
                class="lp-nav-back"
                href="#"
                onclick="history.back(); return false;"
                aria-label="Zurück"
            >
                &larr;
            </a>

            <div class="lp-global-search">

                <div class="lp-search-controls">

                    <input
                        class="lp-search"
                        id="lp-search"
                        type="search"
                        placeholder="Lerninhalte suchen ..."
                        aria-label="Lerninhalte suchen"
                        autocomplete="off"
                    >

                    <button
                        class="lp-search-button"
                        id="lp-search-button"
                        type="button"
                        aria-label="Suche öffnen"
                        title="Suchen"
                    >
                        &#128269;
                    </button>

                </div>

                <div
                    class="lp-search-results"
                    id="lp-search-results"
                    hidden
                ></div>

            </div>

        </nav>

        <nav
            class="lp-breadcrumb"
            aria-label="Pfad"
        >
            <a href="index.html">Lernportal</a>
        </nav>

        <header class="lp-header">
            <h1>Lernportal</h1>
        </header>

        <section class="lp-menu">
            
<a class="lp-card lp-folder" href="klasse7/">
    <span class="lp-card-text">
        <span class="lp-card-title">Klasse 7</span>
    </span>
    <span class="lp-arrow">&rarr;</span>
</a>

<a class="lp-card lp-folder" href="klasse8/">
    <span class="lp-card-text">
        <span class="lp-card-title">Klasse 8</span>
    </span>
    <span class="lp-arrow">&rarr;</span>
</a>

<a class="lp-card lp-folder" href="klasse9/">
    <span class="lp-card-text">
        <span class="lp-card-title">Klasse 9</span>
    </span>
    <span class="lp-arrow">&rarr;</span>
</a>

<a class="lp-card lp-folder" href="klasse10/">
    <span class="lp-card-text">
        <span class="lp-card-title">Klasse 10</span>
    </span>
    <span class="lp-arrow">&rarr;</span>
</a>

<a class="lp-card lp-folder" href="sek2/">
    <span class="lp-card-text">
        <span class="lp-card-title">Sekundarstufe II</span>
    </span>
    <span class="lp-arrow">&rarr;</span>
</a>

        </section>

    </main>


<script>

const searchIndex = [{'title': 'Sprachen formalisier', 'url': 'klasse10/Lernbereich - Sprachen/sprachen_formalisier.html', 'location': 'Klasse 10 › Lernbereich   Sprachen'}];

const searchInput =
    document.getElementById("lp-search");

const searchButton =
    document.getElementById("lp-search-button");

const searchResults =
    document.getElementById("lp-search-results");


function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function renderSearchResults() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    if (!query) {
        searchResults.innerHTML = "";
        searchResults.hidden = true;
        return;
    }

    const matches =
        searchIndex
            .filter(item => {

                const haystack =
                    (
                        item.title
                        + " "
                        + item.location
                    ).toLowerCase();

                return haystack.includes(query);

            })
            .slice(0, 15);


    if (matches.length === 0) {

        searchResults.innerHTML =
            '<div class="lp-search-empty">'
            + 'Keine Lerninhalte gefunden.'
            + '</div>';

        searchResults.hidden = false;

        return;
    }


    searchResults.innerHTML =
        matches
            .map(item => {

                const location =
                    item.location
                    ? (
                        '<span class="lp-result-location">'
                        + escapeHtml(item.location)
                        + '</span>'
                    )
                    : '';

                return (
                    '<a class="lp-search-result" href="'
                    + escapeHtml(item.url)
                    + '">'
                    + '<span class="lp-result-title">'
                    + escapeHtml(item.title)
                    + '</span>'
                    + location
                    + '</a>'
                );

            })
            .join("");

    searchResults.hidden = false;
}


if (
    searchInput
    && searchButton
    && searchResults
) {

    searchButton.addEventListener(
        "click",
        function () {

            const opened =
                document.body.classList
                    .contains("lp-search-open");

            document.body.classList.toggle(
                "lp-search-open",
                !opened
            );

            if (!opened) {
                searchInput.focus();
                renderSearchResults();
            }
            else {
                searchResults.hidden = true;
            }

        }
    );


    searchInput.addEventListener(
        "input",
        renderSearchResults
    );


    searchInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {

                document.body.classList.remove(
                    "lp-search-open"
                );

                searchResults.hidden = true;
                searchInput.blur();
            }

            if (
                event.key === "Enter"
                && !searchResults.hidden
            ) {

                const first =
                    searchResults.querySelector(
                        ".lp-search-result"
                    );

                if (first) {
                    first.click();
                }
            }

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                !event.target.closest(
                    ".lp-global-search"
                )
            ) {
                searchResults.hidden = true;
            }

        }
    );

}

</script>

</body>
</html>
