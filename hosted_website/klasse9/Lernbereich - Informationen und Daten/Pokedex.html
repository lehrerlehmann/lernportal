<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedex</title>
  <style>
    :root { color-scheme: light; --bg:#f3f6fb; --card:#fff; --ink:#17263e; --muted:#62728a; --blue:#2764b6; --line:#dfe6ef; --soft:#eef4fc; --red:#a43232; --green:#28714c; }
    * { box-sizing:border-box; }
    body { min-width:0; margin:0; background:var(--bg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); font-size:14px; }
    button,textarea,input { font:inherit; }
    button { cursor:pointer; }
    .top { padding:25px max(22px,calc((100vw - 1460px)/2)); background:#142b4d; color:white; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .top h1 { margin:0 0 5px; font-size:24px; font-weight:650; letter-spacing:-.02em; }
    .top p { margin:0; color:#b9cce4; font-size:13px; }
    .top .badge { padding:9px 12px; background:#27476c; border-radius:8px; font-size:12px; white-space:nowrap; }
    .shell { width:100%; max-width:1500px; margin:auto; padding:24px 22px 48px; display:grid; grid-template-columns:240px minmax(0,1fr); gap:22px; align-items:start; }
    .panel { min-width:0; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 8px #223d5a08; }
    .sidebar { padding:18px; position:sticky; top:15px; }
    .label { font-size:11px; text-transform:uppercase; letter-spacing:.09em; font-weight:750; color:var(--muted); margin:0 0 13px; }
    .tables { display:grid; gap:6px; }
    .table-choice { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; border:0; text-align:left; background:transparent; border-radius:8px; padding:10px; color:var(--ink); }
    .table-choice.active { background:#e8f1fd; color:#1e56a1; font-weight:650; }
    .table-choice:hover:not(.active) { background:#f5f8fc; }
    .table-choice span:last-child { font-size:11px; color:var(--muted); }
    .divider { border:0; border-top:1px solid var(--line); margin:20px 0; }
    .small { color:var(--muted); line-height:1.55; font-size:12px; }
    .action { border:1px solid #b8cce9; border-radius:8px; background:white; color:#244b83; padding:9px 12px; font-weight:600; }
    .action:hover:not(:disabled) { background:var(--soft); }
    .action:disabled { opacity:.45; cursor:default; }
    .action.primary { background:var(--blue); color:white; border-color:var(--blue); }
    .action.primary:hover:not(:disabled) { background:#18529c; }
    .action.full { width:100%; margin-top:9px; }
    .content { min-width:0; width:100%; max-width:100%; display:grid; grid-template-columns:minmax(0,1fr); gap:22px; }
    .section-head { padding:20px 22px 16px; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .section-head h2 { margin:0 0 6px; font-size:19px; }
    .section-head p { margin:0; color:var(--muted); font-size:12px; }
    .count { background:var(--soft); padding:8px 11px; border-radius:7px; color:#2b5489; font-weight:600; }
    .table-scroll { display:block; min-width:0; overflow-x:auto; overflow-y:hidden; width:100%; max-width:100%; border-block:1px solid var(--line); scrollbar-width:thin; scrollbar-color:#8caaca #edf2f8; }
    .table-scroll::-webkit-scrollbar { width:13px; height:13px; }
    .table-scroll::-webkit-scrollbar-thumb { background:#a3b8d2; border:2px solid #edf2f8; border-radius:10px; }
    .table-scroll::-webkit-scrollbar-track { background:#edf2f8; }
    .table-scroll::-webkit-scrollbar-corner { background:#edf2f8; }
    /* Eigenständige horizontale Scrollleiste unmittelbar über der Datentabelle. */
    .horizontal-track { max-width:100%; min-width:0; overflow-x:auto; overflow-y:hidden; height:22px; width:100%; background:#e5edf8; border-top:1px solid var(--line); scrollbar-color:#8caaca #edf2f8; }
    .horizontal-track-inner { height:1px; }
    .horizontal-track[hidden] { display:none; }
    .horizontal-track::-webkit-scrollbar { height:18px; }
    .horizontal-track::-webkit-scrollbar-thumb { background:#769bc4; border:2px solid #e5edf8; border-radius:10px; }
    .horizontal-track::-webkit-scrollbar-track { background:#edf2f8; }
    table { border-collapse:collapse; font-size:12.5px; width:max-content; min-width:100%; text-align:left; }
    th,td { padding:12px 14px; border-bottom:1px solid #e8edf3; white-space:nowrap; max-width:330px; overflow:hidden; text-overflow:ellipsis; }
    th { background:#f7f9fc; font-weight:700; color:#3b526e; position:sticky; top:0; }
    tbody tr:nth-child(even) { background:#fcfdff; }
    tbody tr:hover { background:#f2f7ff; }
    tbody tr:last-child td { border-bottom:0; }
    td.null { color:#9ea9b6; font-style:italic; }
    .pagination { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:15px 22px; }
    .pagination-controls { display:flex; align-items:center; gap:9px; }
    .pagination-info { color:var(--muted); font-size:12px; }
    .sql-body { min-width:0; padding:0 22px 20px; }
    .editor-label { display:block; font-weight:650; margin-bottom:9px; font-size:12px; }
    textarea { display:block; width:100%; min-height:125px; resize:vertical; border:1px solid #bdccdf; border-radius:9px; outline:none; background:#f9fbfe; color:#163759; padding:15px; font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; tab-size:2; }
    textarea:focus { border-color:#4b84c9; box-shadow:0 0 0 3px #4b84c91d; }
    .editor-actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:13px; }
    .hint { color:var(--muted); font-size:12px; }
    .examples { display:flex; flex-wrap:wrap; gap:7px; margin-top:15px; }
    .examples button { border:1px solid var(--line); background:#f7f9fc; color:#385c85; border-radius:100px; padding:6px 11px; font-size:11px; }
    .examples button:hover { border-color:#9ab6d9; background:#edf4fe; }
    .status { margin-top:14px; color:var(--muted); font-size:12px; min-height:17px; white-space:pre-wrap; }
    .status.error { color:var(--red); }
    .status.good { color:var(--green); }
    .result-area { min-width:0; max-width:100%; margin-top:15px; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
    .result-bar { padding:11px 14px; font-weight:650; font-size:12px; color:#52647a; background:#f7f9fc; border-bottom:1px solid var(--line); }
    .result-area .table-scroll { border:0; }
    .placeholder { padding:35px 15px; text-align:center; color:var(--muted); }
    .schema { font:12px/1.7 ui-monospace,monospace; overflow-wrap:anywhere; color:#4e6079; }
    .schema strong { color:#1c4f92; }
    @media (max-width:800px) { .shell { grid-template-columns:minmax(0,1fr); padding:14px; } .sidebar { position:static; } .tables { display:flex; flex-wrap:wrap; } .table-choice { width:auto; gap:18px; } .top { padding:22px 16px; } .top .badge { display:none; } }
  </style>

  <header class="top">
    <div><h1>Pokedex</h1></div>
    <span class="badge" id="connectionState">Datenbank wird geladen …</span>
  </header>
  <main class="shell">
    <aside class="panel sidebar">
      <p class="label">Tabellen</p>
      <nav id="tableList" class="tables"><span class="small">Wird geladen …</span></nav>
      <hr class="divider">
      <p class="label">Spalten der Tabelle</p>
      <div class="schema" id="schema">–</div>
    </aside>
    <div class="content">
      <section class="panel">
        <div class="section-head"><div><h2 id="tableTitle">Tabellenansicht</h2><p>Jeweils 10 Datensätze pro Seite</p></div><span class="count" id="tableCount">–</span></div>
        <div class="table-scroll" id="browseTable"><div class="placeholder">Datenbank wird geladen …</div></div>
        <div class="horizontal-track" id="browseScroll" aria-label="Tabelle horizontal scrollen"><div class="horizontal-track-inner" id="browseScrollInner"></div></div>
        <div class="pagination"><span class="pagination-info" id="pageInfo">–</span><div class="pagination-controls"><button type="button" class="action" id="previous">← Zurück</button><span class="pagination-info" id="pageNumber">–</span><button type="button" class="action" id="next">Weiter →</button></div></div>
      </section>
      <section class="panel">
        <div class="section-head"><div><h2>SQL-Abfragen</h2></div></div>
        <div class="sql-body">
          <label for="query" class="editor-label">SQL-Abfrage</label>
          <textarea id="query" spellcheck="false">SELECT * FROM pokemon LIMIT 10;</textarea>
          <div class="editor-actions"><button class="action primary" id="runQuery">▶ Abfrage ausführen</button><span class="hint">Tastenkürzel: Strg + Enter</span></div>
          <div class="examples" id="examples">
            <button type="button" data-query="SELECT * FROM pokemon LIMIT 10;">Pokémon anzeigen</button>
            <button type="button" data-query="SELECT name_de, generation, kp, angriff FROM pokemon WHERE generation = 1 ORDER BY angriff DESC LIMIT 10;">Stärkste Angreifer (Gen. 1)</button>
            <button type="button" data-query="SELECT p.name_de, t.typ_1, t.typ_2 FROM pokemon AS p JOIN typen AS t ON p.typen_id = t.typen_id LIMIT 20;">Tabellen verknüpfen</button>
            <button type="button" data-query="SELECT generation, COUNT(*) AS anzahl FROM pokemon GROUP BY generation ORDER BY generation;">Pokémon je Generation</button>
          </div>
          <div class="status" id="queryStatus" aria-live="polite">Noch keine Abfrage ausgeführt.</div>
          <div class="result-area" id="resultArea" hidden><div class="result-bar" id="resultInfo">Ergebnis</div><div class="table-scroll" id="resultTable"></div><div class="horizontal-track" id="resultScroll" aria-label="Ergebnis horizontal scrollen"><div class="horizontal-track-inner" id="resultScrollInner"></div></div></div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
  <script>
    'use strict';
    const SQL_JS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/';
    const PAGE_SIZE = 10;
    const EMBEDDED_DB_BASE64 = document.getElementById('embeddedDatabase').textContent.trim();
    const $ = id => document.getElementById(id);
    let SQL, db, tables = [], activeTable = null, page = 0;
    const escapeIdent = value => '"' + String(value).replaceAll('"', '""') + '"';
    const fmt = number => Number(number).toLocaleString('de-DE');

    function setConnection(message, ok = false) {
      $('connectionState').textContent = message;
      $('connectionState').style.background = ok ? '#245b50' : '#27476c';
    }

    function execute(sql, params = []) {
      if (!db) throw Error('Es wurde noch keine Datenbank geladen.');
      const stmt = db.prepare(sql);
      try {
        if (params.length) stmt.bind(params);
        const columns = stmt.getColumnNames(), values = [];
        while (stmt.step()) values.push(stmt.get());
        return { columns, values };
      } finally { stmt.free(); }
    }

    function updateHorizontalTrack(target) {
      const isBrowse = target.id === 'browseTable';
      const track = $(isBrowse ? 'browseScroll' : 'resultScroll');
      const inner = $(isBrowse ? 'browseScrollInner' : 'resultScrollInner');
      const contentWidth = Math.max(target.scrollWidth, target.firstElementChild?.scrollWidth || 0);
      inner.style.width = contentWidth + 'px';
      track.hidden = contentWidth <= target.clientWidth + 1;
      track.scrollLeft = target.scrollLeft;
    }
    for (const [tableId, trackId] of [['browseTable','browseScroll'], ['resultTable','resultScroll']]) {
      const table = $(tableId), track = $(trackId);
      let syncing = false;
      table.addEventListener('scroll', () => {
        if (!syncing) { syncing=true; track.scrollLeft=table.scrollLeft; syncing=false; }
      });
      track.addEventListener('scroll', () => {
        if (!syncing) { syncing=true; table.scrollLeft=track.scrollLeft; syncing=false; }
      });
      new ResizeObserver(() => updateHorizontalTrack(table)).observe(table);
    }
    function displayTable(target, columns, rows) {
      target.replaceChildren();
      if (!columns.length) { const p = document.createElement('div'); p.className='placeholder'; p.textContent='Keine Spalten vorhanden.'; target.append(p); return; }
      const table = document.createElement('table'), thead = document.createElement('thead'), tbody = document.createElement('tbody'), headRow = document.createElement('tr');
      for (const c of columns) { const th = document.createElement('th'); th.textContent=c; headRow.append(th); }
      thead.append(headRow);
      for (const row of rows) {
        const tr=document.createElement('tr');
        for (const value of row) {
          const td=document.createElement('td');
          if (value === null) { td.textContent='NULL'; td.className='null'; }
          else if (value instanceof Uint8Array) td.textContent='[BLOB: '+fmt(value.length)+' Bytes]';
          else td.textContent=String(value);
          td.title=td.textContent;
          tr.append(td);
        }
        tbody.append(tr);
      }
      if (!rows.length) { const tr=document.createElement('tr'), td=document.createElement('td'); td.colSpan=columns.length; td.className='placeholder'; td.textContent='Keine Einträge gefunden.'; tr.append(td); tbody.append(tr); }
      table.append(thead,tbody);target.append(table);
      target.scrollLeft=0;
      updateHorizontalTrack(target);
      requestAnimationFrame(() => updateHorizontalTrack(target));
    }

    function getColumns(tableName) {
      return execute(`PRAGMA table_info(${escapeIdent(tableName)})`).values;
    }
    function selectTable(name) {
      activeTable=name;page=0;
      renderList();renderBrowse();
    }
    function renderList() {
      const target=$('tableList');target.replaceChildren();
      for(const entry of tables) {
        const button=document.createElement('button');button.type='button';button.className='table-choice'+(entry.name===activeTable?' active':'');
        const title=document.createElement('span');title.textContent=entry.name;
        const count=document.createElement('span');count.textContent=fmt(entry.count);
        button.append(title,count);button.addEventListener('click',()=>selectTable(entry.name));target.append(button);
      }
    }
    function renderBrowse() {
      if (!activeTable) return;
      try {
        const count=tables.find(t=>t.name===activeTable).count;
        const totalPages=Math.max(1,Math.ceil(count/PAGE_SIZE));
        page=Math.max(0,Math.min(page,totalPages-1));
        $('tableTitle').textContent=activeTable;
        $('tableCount').textContent=fmt(count)+' Einträge';
        const cols=getColumns(activeTable);
        $('schema').replaceChildren();
        for(const col of cols) { const line=document.createElement('div'), key=document.createElement('strong');key.textContent=col[1];line.append(key,document.createTextNode(' · '+(col[2]||'ohne Typangabe')));$('schema').append(line); }
        const result=execute('SELECT * FROM '+escapeIdent(activeTable)+' LIMIT ? OFFSET ?', [PAGE_SIZE,page*PAGE_SIZE]);
        displayTable($('browseTable'),result.columns,result.values);
        $('pageInfo').textContent=count ? `${fmt(page*PAGE_SIZE+1)}–${fmt(Math.min((page+1)*PAGE_SIZE,count))} von ${fmt(count)} Einträgen` : '0 Einträge';
        $('pageNumber').textContent=`Seite ${fmt(page+1)} / ${fmt(totalPages)}`;
        $('previous').disabled=page===0;$('next').disabled=page>=totalPages-1;
      } catch(e) { $('browseTable').textContent='Fehler: '+e.message; }
    }
    function refreshDatabase() {
      tables=execute("SELECT name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name COLLATE NOCASE").values.map(([name]) => ({name,count:execute('SELECT COUNT(*) FROM '+escapeIdent(name)).values[0][0]}));
      activeTable=tables[0]?.name ?? null;page=0;
      renderList();
      if (activeTable) renderBrowse();
      else { $('browseTable').textContent='Keine Tabellen vorhanden.';$('schema').textContent='–'; }
    }
    function loadBytes(bytes) {
      if(db) db.close();
      db = new SQL.Database(new Uint8Array(bytes));
      refreshDatabase();
      setConnection(`${tables.length} Tabellen fest eingebunden`,true);
      $('queryStatus').className='status good';$('queryStatus').textContent='';
      $('resultArea').hidden=true;
    }
    function loadEmbedded() {
      const binary = atob(EMBEDDED_DB_BASE64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      loadBytes(bytes);
      setConnection(`${tables.length} Tabellen fest eingebunden`, true);
      $('queryStatus').textContent = '';
    }
    function runQuery() {
      const sql=$('query').value.trim();
      const status=$('queryStatus');
      if (!sql) {status.className='status error';status.textContent='Bitte eine SQL-Abfrage eingeben.';return;}
      // SQL queries can be read-only; changes to db are intentionally rejected.
      if (!/^(SELECT|WITH|PRAGMA|EXPLAIN)\b/i.test(sql)) {
        status.className='status error';status.textContent='Bitte eine lesende SQL-Abfrage eingeben.';return;
      }
      try {
        const start=performance.now();
        // query_only prevents modifications hidden in e.g. WITH, PRAGMA or extra statements.
        db.run('PRAGMA query_only = ON');
        const statements=db.exec(sql);
        const elapsed=Math.round(performance.now()-start);
        const result=statements.at(-1);
        $('resultArea').hidden=false;
        if (result) {
          displayTable($('resultTable'), result.columns, result.values);
          $('resultInfo').textContent=fmt(result.values.length)+' Ergebniszeilen · '+fmt(result.columns.length)+' Spalten';
          status.textContent='Abfrage erfolgreich ausgeführt ('+elapsed+' ms).';
        } else {
          $('resultTable').replaceChildren();
          $('resultInfo').textContent='Keine Ergebnistabelle';
          status.textContent='Abfrage ausgeführt ('+elapsed+' ms), keine Ergebniszeilen.';
        }
        status.className='status good';
      } catch(e) {
        status.className='status error';status.textContent='SQL-Fehler: '+e.message;
        $('resultArea').hidden=true;
      }
    }
    $('previous').addEventListener('click',()=>{if(page>0){page--;renderBrowse();}});
    $('next').addEventListener('click',()=>{page++;renderBrowse();});
    $('runQuery').addEventListener('click',runQuery);
    $('query').addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();runQuery();}});
    $('examples').addEventListener('click',event=>{const b=event.target.closest('[data-query]');if(b){$('query').value=b.dataset.query;$('query').focus();}});
    (async()=>{
      try {
        if(typeof initSqlJs!=='function') throw Error('sql.js konnte nicht geladen werden. Bitte Internetverbindung prüfen.');
        SQL=await initSqlJs({locateFile:file=>SQL_JS_BASE+file});
        loadEmbedded();
      } catch(e) {setConnection('SQLite nicht verfügbar');$('queryStatus').className='status error';$('queryStatus').textContent=e.message;}
    })();
  </script>
